<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050608"><title>Warfront: Rise of Ash</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;font-family:Georgia,serif;color:#eee}.wrap{position:fixed;inset:0;display:grid;place-items:center;background:#020304}.game{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;overflow:hidden;box-shadow:0 0 50px #000}.scene{position:absolute;inset:0;background:url('assets/warfront_final_bg.jpg') center/cover no-repeat;transform:scale(1.002);transition:transform .18s}.game.shake .scene{animation:shake .28s linear}.game.assault .scene{transform:scale(1.012)}@keyframes shake{0%,100%{transform:translate(0) scale(1.006)}25%{transform:translate(-5px,2px) scale(1.006)}50%{transform:translate(5px,-2px) scale(1.006)}75%{transform:translate(-3px,1px) scale(1.006)}}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 50%,#0008 100%)}.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}.ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff8b2d;box-shadow:0 0 8px #ff4c16;animation:rise linear forwards}@keyframes rise{from{transform:translateY(0) scale(.7);opacity:.2}40%{opacity:.9}to{transform:translateY(-34vh) translateX(28px) scale(1.2);opacity:0}}.live{position:absolute;z-index:8;background:#060709d8;border:1px solid #9f7948;box-shadow:0 3px 12px #000a;color:#eee;text-shadow:0 1px #000}.status{left:50%;top:13.4%;transform:translateX(-50%);width:28%;min-width:255px;padding:.45% 1.2%;text-align:center;font-size:clamp(10px,1.25vw,20px)}.status b{letter-spacing:.06em}.mana{color:#55bfff}.toast{left:50%;bottom:31%;transform:translateX(-50%);padding:.55% 1.2%;font:bold clamp(9px,1vw,15px) Arial;opacity:0;transition:.18s}.toast.on{opacity:1}.hpbar{position:absolute;z-index:7;height:1.65%;top:5.85%;overflow:hidden;border-radius:2px}.hpbar.left{left:11.3%;width:20.9%}.hpbar.right{right:10.8%;width:20.7%}.hpbar i{display:block;height:100%;transition:width .25s}.hpbar.left i{background:linear-gradient(90deg,#0a72cb,#38b9ff);box-shadow:0 0 7px #2da9ff}.hpbar.right i{margin-left:auto;background:linear-gradient(90deg,#d8171e,#ff4545);box-shadow:0 0 7px #ff3333}.hit{position:absolute;z-index:12;background:transparent;border:0;padding:0;touch-action:manipulation}.hit:active{background:#ffffff10}.cards .hit{bottom:4.2%;height:20.3%;width:8.4%}.c1{left:18.15%}.c2{left:27.25%}.c3{left:36.35%}.c4{left:45.45%}.c5{left:54.55%}.c6{left:63.65%}.hold{left:76.1%;bottom:14.6%;width:7.5%;height:10%}.assault{left:84.0%;bottom:14.6%;width:7.7%;height:10%}.retreat{left:92.0%;bottom:14.6%;width:7.3%;height:10%}.meteorBtn{left:76.2%;bottom:3.7%;width:23%;height:9.8%}.speed{left:.7%;width:4.5%;height:7.9%}.s1{top:23.2%}.s2{top:31.5%}.s3{top:40.2%}.pulse{position:absolute;z-index:5;left:38%;top:51%;width:28%;height:17%;border-radius:50%;pointer-events:none;opacity:0}.pulse.blue{background:radial-gradient(ellipse,#2c9cff66,transparent 65%)}.pulse.red{background:radial-gradient(ellipse,#ff3d3d66,transparent 65%)}.pulse.go{animation:pulse .55s ease-out}@keyframes pulse{0%{opacity:0;transform:scale(.4)}35%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}.arrow{position:absolute;z-index:6;width:3.8%;height:2px;background:#e7e7e7;transform-origin:left center;filter:drop-shadow(0 0 2px #000);animation:fly .55s linear forwards}@keyframes fly{to{transform:translateX(28vw) rotate(var(--r));opacity:.1}}.meteorFx{position:absolute;z-index:15;width:5.5%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6af 0 10%,#ffad26 26%,#f43 48%,transparent 67%);box-shadow:0 0 25px #ff5c0f;animation:meteor .55s ease-in forwards}@keyframes meteor{from{transform:translate(18vw,-45vh) scale(.25)}75%{opacity:1}to{transform:translate(0,0) scale(2.4);opacity:0}}.screenFlash{position:absolute;z-index:14;inset:0;background:#ff7b2b;opacity:0;pointer-events:none}.screenFlash.go{animation:flash .25s}@keyframes flash{50%{opacity:.12}}.rotate{display:none;position:fixed;z-index:50;inset:0;background:#050608;color:#ddd;align-items:center;justify-content:center;text-align:center;padding:30px;font:bold 18px Arial}@media(orientation:portrait) and (max-width:900px){.rotate{display:flex}.wrap{display:none}}@media(max-width:900px){.status{min-width:210px;font-size:9px}.toast{bottom:29%;font-size:8px}}
</style></head><body><div class="rotate">Turn your phone sideways for Warfront ⚔️</div><div class="wrap"><div id="game" class="game"><div class="scene"></div><div class="vignette"></div><div id="embers" class="embers"></div><div class="hpbar left"><i id="php" style="width:100%"></i></div><div class="hpbar right"><i id="ehp" style="width:94%"></i></div><div class="live status"><b>CHAPTER I — THE ASHEN PLAINS</b><br>Wave <span id="wave">3</span>/8 · <span class="mana">MANA <span id="mana">211</span>/500</span></div><div id="toast" class="live toast"></div><div id="pulse" class="pulse blue"></div><div id="flash" class="screenFlash"></div><div class="cards"><button class="hit c1" data-u="Swordsman" data-cost="50"></button><button class="hit c2" data-u="Spearman" data-cost="70"></button><button class="hit c3" data-u="Archer" data-cost="100"></button><button class="hit c4" data-u="Cavalry" data-cost="180"></button><button class="hit c5" data-u="Berserker" data-cost="120"></button><button class="hit c6" data-u="Ballista" data-cost="160"></button></div><button class="hit hold" id="hold"></button><button class="hit assault" id="assault"></button><button class="hit retreat" id="retreat"></button><button class="hit meteorBtn" id="meteor"></button><button class="hit speed s1" data-s="1"></button><button class="hit speed s2" data-s="2"></button><button class="hit speed s3" data-s="3"></button></div></div><script>
const G=document.getElementById('game'),M=document.getElementById('mana'),W=document.getElementById('wave'),E=document.getElementById('ehp'),P=document.getElementById('php'),T=document.getElementById('toast'),PL=document.getElementById('pulse'),FL=document.getElementById('flash'),EM=document.getElementById('embers');let mana=211,enemy=7980,player=8420,wave=3,speed=1,order='hold',last=performance.now(),dead=false;function toast(t){T.textContent=t;T.classList.add('on');clearTimeout(T._t);T._t=setTimeout(()=>T.classList.remove('on'),900)}function burst(cls='blue'){PL.className='pulse '+cls;void PL.offsetWidth;PL.classList.add('go')}function shake(){G.classList.remove('shake');void G.offsetWidth;G.classList.add('shake');setTimeout(()=>G.classList.remove('shake'),300)}function arrow(){let a=document.createElement('i');a.className='arrow';a.style.left=(39+Math.random()*9)+'%';a.style.top=(47+Math.random()*12)+'%';a.style.setProperty('--r',(Math.random()*7-3)+'deg');G.append(a);setTimeout(()=>a.remove(),650)}function hitEnemy(n){enemy=Math.max(0,enemy-n);burst('blue');shake();E.style.width=(enemy/8500*100)+'%';let nw=Math.min(8,Math.max(1,1+Math.floor((8500-enemy)/1060)));if(nw!==wave){wave=nw;W.textContent=wave;toast(wave===8?'ASH TYRANT — FINAL WAVE':'WAVE '+wave)}}document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{let c=+b.dataset.cost;if(mana<c)return toast('NOT ENOUGH MANA');mana-=c;M.textContent=Math.floor(mana);burst('blue');for(let i=0;i<(b.dataset.u==='Archer'?3:1);i++)setTimeout(arrow,i*100);setTimeout(()=>hitEnemy(110+c*1.5),350);toast(b.dataset.u.toUpperCase()+' DEPLOYED')});document.getElementById('meteor').onclick=()=>{if(mana<300)return toast('NEED 300 MANA');mana-=300;M.textContent=Math.floor(mana);for(let i=0;i<6;i++)setTimeout(()=>{let m=document.createElement('i');m.className='meteorFx';m.style.left=(56+Math.random()*28)+'%';m.style.top=(30+Math.random()*28)+'%';G.append(m);setTimeout(()=>m.remove(),700)},i*90);FL.classList.remove('go');void FL.offsetWidth;FL.classList.add('go');setTimeout(()=>hitEnemy(1200),380);toast('METEOR RAIN!')};document.getElementById('hold').onclick=()=>{order='hold';G.classList.remove('assault');toast('HOLD THE LINE')};document.getElementById('assault').onclick=()=>{order='assault';G.classList.add('assault');burst('blue');toast('ALL UNITS — ASSAULT!')};document.getElementById('retreat').onclick=()=>{order='retreat';G.classList.remove('assault');toast('FALL BACK!')};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;toast('BATTLE SPEED ×'+speed)});function ember(){let e=document.createElement('i');e.className='ember';e.style.left=(60+Math.random()*38)+'%';e.style.top=(45+Math.random()*38)+'%';e.style.animationDuration=(1.6+Math.random()*1.8)+'s';EM.append(e);setTimeout(()=>e.remove(),3600)}setInterval(ember,110);function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;mana=Math.min(500,mana+8*dt*speed);if(order==='assault')enemy=Math.max(0,enemy-18*dt*speed);if(order==='retreat')player=Math.min(8500,player+10*dt*speed);M.textContent=Math.floor(mana);E.style.width=(enemy/8500*100)+'%';P.style.width=(player/8500*100)+'%';if(enemy<=0&&!dead){dead=true;toast('VICTORY — OBSIDIAN LINE SHATTERED');setTimeout(()=>{enemy=8500;wave=1;W.textContent=1;dead=false},1700)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
