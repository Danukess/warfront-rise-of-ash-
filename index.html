<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Warfront: Rise of Ash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;color:#eee;font-family:Georgia,serif}.game{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 25%,#40372b,#111820 45%,#050608)}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:2px solid #705a34;background:linear-gradient(#25272a,#0c0d0f);box-shadow:0 4px 15px #000}.logo{font-weight:900;letter-spacing:2px;color:#d6b46b;text-shadow:0 2px #000}.bars{display:flex;gap:9px;font-family:Arial;font-size:12px}.bar{min-width:180px}.track{height:10px;background:#18090a;border:1px solid #796445}.fill{height:100%;background:linear-gradient(90deg,#8b1f24,#e04a3e)}.blue{background:linear-gradient(90deg,#174b83,#48a0db)}main{flex:1;position:relative;overflow:hidden;background:linear-gradient(#28333b 0 42%,#453b30 43%,#211b16);isolation:isolate}.mountains{position:absolute;inset:0;background:radial-gradient(ellipse at 22% 42%,#5c6970 0 7%,transparent 8%),radial-gradient(ellipse at 42% 37%,#48555d 0 12%,transparent 13%),radial-gradient(ellipse at 74% 34%,#373b3d 0 15%,transparent 16%),linear-gradient(transparent 45%,#16130f 46%);opacity:.75}.castle{position:absolute;bottom:20%;width:13%;height:44%;filter:drop-shadow(0 8px 8px #000)}.castle.left{left:0;background:linear-gradient(90deg,#222a31,#58636b,#1a2025);clip-path:polygon(0 25%,22% 25%,22% 10%,38% 10%,38% 27%,60% 27%,60% 0,78% 0,78% 25%,100% 25%,100% 100%,0 100%)}.castle.right{right:0;background:linear-gradient(90deg,#251114,#5a2225,#16090a);clip-path:polygon(0 25%,22% 25%,22% 0,40% 0,40% 27%,62% 27%,62% 8%,78% 8%,78% 25%,100% 25%,100% 100%,0 100%)}.flag{position:absolute;top:11%;width:70px;height:42px;clip-path:polygon(0 0,100% 15%,72% 50%,100% 85%,0 100%);animation:flag 1s ease-in-out infinite alternate}.flag.l{left:8%;background:#205a9d}.flag.r{right:8%;background:#9a2028;transform:scaleX(-1)}@keyframes flag{to{skew:5deg}}.ground{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(#554a3c,#292118 35%,#110e0b);border-top:2px solid #70604b}.troop{position:absolute;width:54px;height:82px;bottom:18%;will-change:transform;filter:drop-shadow(0 5px 3px #000b);animation:bob .7s ease-in-out infinite alternate}.troop .shadow{position:absolute;bottom:0;left:8px;width:40px;height:9px;border-radius:50%;background:#0009}.troop .cape{position:absolute;left:10px;top:29px;width:35px;height:43px;background:linear-gradient(135deg,#214e79,#08111b);clip-path:polygon(10% 0,90% 0,100% 100%,45% 82%,0 100%)}.troop.enemy .cape{background:linear-gradient(135deg,#81252d,#18080a)}.troop .legs{position:absolute;left:17px;top:57px;width:7px;height:24px;background:#161a1e;box-shadow:17px 0 #161a1e}.troop .body{position:absolute;left:12px;top:28px;width:32px;height:35px;background:linear-gradient(100deg,#8e999f,#26333c 52%,#0b1015);clip-path:polygon(15% 0,85% 0,100% 90%,50% 100%,0 90%)}.troop.enemy .body{background:linear-gradient(100deg,#81333a,#321015 52%,#100507)}.troop .head{position:absolute;left:18px;top:9px;width:20px;height:23px;border-radius:45%;background:linear-gradient(#9aa4a8,#263038);border:1px solid #bbc2c4}.troop.enemy .head{background:linear-gradient(#772c34,#1a080a);border-color:#a65359}.troop .visor{position:absolute;left:20px;top:18px;width:16px;height:4px;background:#08131b;box-shadow:inset 0 0 5px #4ca1ff}.troop.enemy .visor{box-shadow:inset 0 0 5px #ff3540}.troop .weapon{position:absolute;left:47px;top:27px;width:4px;height:51px;background:#d5d7d6;transform:rotate(25deg);transform-origin:50% 85%}.troop.archer .weapon{width:25px;height:42px;left:42px;border:3px solid #9d7743;border-left:0;background:none;border-radius:0 50% 50% 0;transform:none}.troop.spear .weapon{height:72px;top:4px;background:#74532d;transform:rotate(60deg)}.troop.knight{transform:scale(1.18)}.troop.hero{transform:scale(1.35);z-index:8}.troop.hero .cape{background:linear-gradient(#8a1d27,#18080a)}.troop.titan{transform:scale(2);transform-origin:bottom;z-index:7}.troop.titan .body{background:linear-gradient(#5b4037,#21100d);box-shadow:inset 0 0 8px #ff4b20}.troop.attack .weapon{animation:slash .22s ease-out}@keyframes bob{to{translate:0 -3px}}@keyframes slash{50%{transform:rotate(105deg)}}.fx{position:absolute;border-radius:50%;pointer-events:none}.meteor{width:45px;height:45px;background:#ffb025;box-shadow:0 0 20px #ff3b0a,0 0 50px #ff7200;animation:meteor .65s linear forwards}@keyframes meteor{from{transform:translate(200px,-300px)}to{transform:translate(0,0) scale(2);opacity:0}}footer{height:154px;padding:8px;background:linear-gradient(#15171a,#070809);border-top:2px solid #705a34;display:flex;gap:7px;align-items:stretch}.portrait{width:118px;border:1px solid #765f38;background:radial-gradient(circle at 50% 30%,#59443a,#171312);padding:8px;text-align:center}.portrait .face{height:75px;margin:auto;background:linear-gradient(135deg,#aaa,#29272b,#09090a);clip-path:polygon(30% 0,70% 0,90% 30%,80% 100%,20% 100%,10% 30%)}.cards{display:flex;gap:6px;flex:1;overflow-x:auto}.card{min-width:82px;border:1px solid #69583a;background:linear-gradient(#31363b,#121416);padding:6px;text-align:center;position:relative;touch-action:manipulation}.card:active{transform:scale(.95)}.icon{height:60px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle,#4e555a,#151719);border:1px solid #555}.name{font:700 11px Arial;margin-top:5px}.cost{font:10px Arial;color:#7cc8ff}.orders{width:205px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.orders button,.speed button{background:linear-gradient(#4b3a28,#21170e);border:1px solid #98713c;color:#eee;font-weight:700}.orders .assault{background:linear-gradient(#812329,#321014);border-color:#b95156}.speed{position:absolute;right:12px;top:12px;display:flex;gap:4px;z-index:20}.speed button{width:40px;height:30px}.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;background:#0b0c0de8;border:1px solid #80663c;padding:5px 15px;text-align:center;font:12px Arial}.mana{color:#6bc4ff}.notice{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:30;background:#08090be8;border:1px solid #725d3b;padding:7px 16px;font:12px Arial;opacity:0;transition:.2s}.notice.show{opacity:1}@media(max-width:700px){header{height:48px}.logo{font-size:12px}.bar{min-width:105px}.bars{font-size:9px}footer{height:132px}.portrait{width:82px}.portrait .face{height:58px}.card{min-width:67px;padding:4px}.icon{height:47px;font-size:23px}.orders{width:145px}.troop{transform:scale(.82);transform-origin:bottom}.troop.hero{transform:scale(1.05)}.troop.titan{transform:scale(1.55)}}.perf-low .troop{filter:none}.perf-low .mountains{opacity:.45}</style></head><body><div class="game"><header><div class="logo">WARFRONT: RISE OF ASH</div><div class="bars"><div class="bar">RAVENHOLD <div class="track"><div id="php" class="fill blue" style="width:100%"></div></div></div><div class="bar">OBSIDIAN LEGION <div class="track"><div id="ehp" class="fill" style="width:100%"></div></div></div></div></header><main id="field"><div class="mountains"></div><div class="castle left"></div><div class="castle right"></div><div class="flag l"></div><div class="flag r"></div><div class="ground"></div><div class="hud"><b>CHAPTER I — THE ASHEN PLAINS</b><br>Wave <span id="wave">1</span>/8 · <span class="mana">Mana <span id="mana">240</span>/500</span></div><div id="notice" class="notice"></div><div class="speed"><button data-s="1">×1</button><button data-s="2">×2</button><button data-s="3">×3</button></div></main><footer><div class="portrait"><div class="face"></div><b>ARTHOS</b><br><small>ASHEN BLADE</small></div><div id="cards" class="cards"></div><div class="orders"><button id="retreat">RETREAT</button><button id="hold">HOLD</button><button class="assault" id="assault">ASSAULT</button><button id="meteor">METEOR</button></div></footer></div><script>const F=document.querySelector('#field'),C=document.querySelector('#cards'),manaEl=document.querySelector('#mana'),eHp=document.querySelector('#ehp'),pHp=document.querySelector('#php'),waveEl=document.querySelector('#wave'),N=document.querySelector('#notice');let mana=240,enemyHP=5600,playerHP=5000,wave=1,speed=1,order='hold',last=performance.now(),fps=[],low=false;const units=[['Swordsman',35,'⚔️','foot'],['Archer',50,'🏹','archer'],['Spearman',65,'🔱','spear'],['Knight',90,'🛡️','knight'],['Priest',110,'✦','priest'],['War Wolf',140,'🐺','wolf'],['Berserker',120,'🪓','foot'],['Ballista',160,'🏹','siege']];function troop(enemy,x,y,type='foot',hero=false,titan=false){let d=document.createElement('div');d.className='troop '+(enemy?'enemy ':'')+type+(hero?' hero':'')+(titan?' titan':'');d.style.left=x+'%';d.style.bottom=y+'%';d.innerHTML='<i class="shadow"></i><i class="cape"></i><i class="legs"></i><i class="body"></i><i class="head"></i><i class="visor"></i><i class="weapon"></i>';F.append(d);return d}troop(false,8,18,'knight',true);['foot','archer','spear','knight','foot','archer','spear','knight'].forEach((t,i)=>troop(false,16+i*2.6,14+(i%3)*4,t));['foot','spear','knight','foot','archer','spear','knight','foot','archer'].forEach((t,i)=>troop(true,80-i*2.5,14+(i%3)*4,t));troop(true,88,23,'knight',false,true);units.forEach((u,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="icon">'+u[2]+'</div><div class="name">'+u[0]+'</div><div class="cost">'+u[1]+' MANA</div>';b.onclick=()=>deploy(u);C.append(b)});function say(s){N.textContent=s;N.classList.add('show');setTimeout(()=>N.classList.remove('show'),900)}function deploy(u){if(mana<u[1])return say('Not enough mana');mana-=u[1];let t=troop(false,12+Math.random()*3,12+Math.random()*10,u[3]);requestAnimationFrame(()=>{t.style.transition='left 3.2s linear';t.style.left='55%'});setTimeout(()=>{t.classList.add('attack');enemyHP=Math.max(0,enemyHP-(70+u[1]*1.6));setTimeout(()=>t.classList.remove('attack'),250)},2600/speed);setTimeout(()=>t.remove(),5000/speed);say(u[0]+' deployed')}document.querySelector('#meteor').onclick=()=>{if(mana<95)return say('Not enough mana');mana-=95;for(let i=0;i<5;i++)setTimeout(()=>{let m=document.createElement('i');m.className='fx meteor';m.style.left=(58+Math.random()*27)+'%';m.style.top=(25+Math.random()*40)+'%';F.append(m);setTimeout(()=>m.remove(),700)},i*90);enemyHP=Math.max(0,enemyHP-420);say('METEOR RAIN')};document.querySelector('#assault').onclick=()=>{order='assault';say('ALL UNITS — ASSAULT!')};document.querySelector('#hold').onclick=()=>{order='hold';say('Hold the line!')};document.querySelector('#retreat').onclick=()=>{order='retreat';say('Fall back!')};document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;say('Battle speed ×'+speed)});function loop(now){let dt=Math.min(.05,(now-last)/1000);let instant=1/Math.max(.001,dt);last=now;fps.push(instant);if(fps.length>90)fps.shift();if(fps.length===90){let avg=fps.reduce((a,b)=>a+b,0)/90;if(avg<44&&!low){low=true;document.body.classList.add('perf-low')}else if(avg>56&&low){low=false;document.body.classList.remove('perf-low')}}mana=Math.min(500,mana+12*dt*speed);if(order==='assault')enemyHP=Math.max(0,enemyHP-20*dt*speed);if(order==='retreat')playerHP=Math.min(5000,playerHP+7*dt*speed);manaEl.textContent=Math.floor(mana);eHp.style.width=(enemyHP/56)+'%';pHp.style.width=(playerHP/50)+'%';let nw=Math.min(8,1+Math.floor((5600-enemyHP)/700));if(nw!==wave){wave=nw;waveEl.textContent=wave;say(wave===8?'BOSS PHASE — ASH TYRANT':'Wave '+wave)}if(enemyHP<=0){enemyHP=5600;wave=1;waveEl.textContent=1;say('VICTORY — Obsidian line shattered!')}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
