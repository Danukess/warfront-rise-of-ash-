<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Warfront: Rise of Ash</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#eee;font-family:Georgia,serif}.game{height:100%;display:grid;grid-template-rows:74px 1fr 170px;background:#050608}.top{display:grid;grid-template-columns:1fr 430px 1fr;align-items:center;gap:14px;padding:7px 16px;background:linear-gradient(#1d2024,#060708);border-bottom:3px ridge #9a7441;z-index:40;box-shadow:0 6px 16px #000}.brand{text-align:center;font-size:30px;letter-spacing:5px;font-weight:900;text-shadow:0 3px 0 #000}.brand span{display:block;color:#c23a35;font-size:13px;letter-spacing:7px}.faction{font:800 14px Arial;letter-spacing:1px}.faction.r{text-align:right;color:#f09a91}.faction.l{color:#bddcff}.track{height:17px;background:#08090b;border:2px ridge #84623a;padding:2px;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,#0e4e91,#48b2ff);transition:width .2s}.r .fill{margin-left:auto;background:linear-gradient(90deg,#9d1119,#ff4848)}
.stage{position:relative;overflow:hidden;background:url('assets/battlefield.svg') center/cover no-repeat;isolation:isolate}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0004,#0000 35%,#0008 100%)}.chapter{position:absolute;z-index:20;left:50%;top:10px;transform:translateX(-50%);min-width:360px;text-align:center;padding:8px 20px;background:#080a0ceb;border:3px ridge #8a673a;box-shadow:0 5px 18px #000}.chapter b{letter-spacing:1px}.mana{color:#5fc3ff}.speed{position:absolute;z-index:25;left:12px;top:16px;display:grid;gap:4px}.speed button,.cmd button{background:linear-gradient(#35281b,#110c08);border:2px ridge #98703c;color:#eee;font-weight:800}.speed button{width:50px;height:42px}.speed button.active{box-shadow:0 0 0 2px #d0a460 inset}.notice{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 18px;background:#060709ef;border:1px solid #a57d49;opacity:0;transition:.18s}.notice.on{opacity:1}.impact{position:absolute;z-index:30;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff6a0 0 12%,#ffad25 30%,#f33 58%,transparent 72%);filter:drop-shadow(0 0 18px #ff5300);animation:boom .65s forwards}@keyframes boom{from{transform:translate(180px,-280px) scale(.2)}to{transform:translate(0,0) scale(2.6);opacity:0}}.arrow{position:absolute;z-index:14;width:34px;height:2px;background:#ddd;transform-origin:left center;filter:drop-shadow(0 0 2px #000)}
.unit{position:absolute;z-index:12;width:84px;height:108px;bottom:18%;transform-origin:50% 100%;transition:filter .15s;will-change:transform,left}.unit.enemy{transform:scaleX(-1)}.unit svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 4px #000b)}.unit .hp{position:absolute;left:12%;right:12%;top:-7px;height:5px;background:#170b0c;border:1px solid #4a3325}.unit .hp i{display:block;height:100%;background:#2c92e8}.unit.enemy .hp i{background:#e43a3f}.unit.attack svg{animation:slash .23s ease-out}.unit.hit{filter:brightness(1.7) saturate(.4)}.unit.dead{animation:die .45s forwards}.unit.walk svg{animation:stride .45s ease-in-out infinite alternate}@keyframes stride{to{transform:translateY(-3px) rotate(-1deg)}}@keyframes slash{50%{transform:rotate(7deg) translateX(5px)}}@keyframes die{to{transform:translateY(18px) rotate(70deg) scale(.75);opacity:0}}
.bottom{display:grid;grid-template-columns:210px 1fr 280px;gap:9px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#13161a,#030405);border-top:3px ridge #8d6a3d}.hero{border:3px ridge #80613a;background:radial-gradient(circle at 45% 20%,#34404a,#101214 58%,#050607);padding:5px;overflow:hidden;display:grid;grid-template-columns:92px 1fr;gap:7px;align-items:center}.hero .portrait{height:110px;background:linear-gradient(135deg,#111,#333);border:1px solid #5e4a2d;position:relative;overflow:hidden}.hero .portrait:before{content:"";position:absolute;inset:8px 16px 0;background:linear-gradient(145deg,#d0d2d1 0 10%,#525b61 28%,#13171b 65%);clip-path:polygon(42% 0,61% 0,73% 12%,90% 40%,78% 100%,20% 100%,8% 40%,28% 12%)}.hero .portrait:after{content:"";position:absolute;width:42px;height:42px;border-radius:48%;left:27px;top:7px;background:linear-gradient(145deg,#2e211e,#08090a);box-shadow:-28px 48px 0 9px #6e1c24}.hero b{font-size:18px}.hero small{color:#d7c39c}.mini{font:11px Arial;margin-top:5px}.mini .row{display:flex;justify-content:space-between;margin:3px 0}.mini .tiny{height:7px;background:#0d1114;border:1px solid #5b452a}.mini .tiny i{display:block;height:100%;background:#d83e3f}.mini .tiny.m i{background:#2789d8}.cards{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.card{position:relative;min-width:120px;padding:5px;color:#eee;background:linear-gradient(#21262b,#0a0c0e);border:3px ridge #765a37;text-align:center;touch-action:manipulation}.card:active{transform:scale(.96)}.art{height:92px;background:radial-gradient(circle at 50% 35%,#4d5862,#16191c 60%,#08090a);display:grid;place-items:center;overflow:hidden}.art svg{width:88px;height:88px;filter:drop-shadow(0 4px 3px #000)}.name{font:bold 11px Arial;margin-top:5px}.cost{font:10px Arial;color:#69c4ff;margin-top:3px}.cmd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmd button{font-size:12px}.cmd .assault{background:linear-gradient(#8b252a,#310c0f);border-color:#c25255}.cmd .meteor{grid-column:1/3;background:linear-gradient(#5a2514,#190a05);color:#ffd4b1}
@media(max-width:800px){.game{grid-template-rows:50px 1fr 132px}.top{grid-template-columns:1fr 190px 1fr;padding:4px 7px;gap:5px}.brand{font-size:14px;letter-spacing:2px}.brand span{font-size:8px;letter-spacing:3px}.faction{font-size:9px}.track{height:10px}.chapter{top:6px;min-width:250px;font-size:10px;padding:5px 10px}.speed{top:48px;left:7px}.speed button{width:36px;height:30px;font-size:9px}.bottom{grid-template-columns:100px 1fr 150px;padding:4px;gap:4px}.hero{display:block;padding:3px}.hero .portrait{height:70px}.hero .portrait:before{inset:4px 19px 0}.hero .portrait:after{width:28px;height:28px;left:32px;top:4px;box-shadow:-18px 31px 0 5px #6e1c24}.hero b{font-size:11px}.hero small,.mini{font-size:7px}.card{min-width:80px;padding:3px}.art{height:62px}.art svg{width:60px;height:60px}.name{font-size:8px}.cost{font-size:7px}.cmd{gap:3px}.cmd button{font-size:8px}.unit{width:58px;height:78px}}
</style></head><body><div class="game"><div class="top"><div class="faction l">RAVENHOLD<div class="track"><div id="pbar" class="fill" style="width:100%"></div></div></div><div class="brand">WARFRONT<span>RISE OF ASH</span></div><div class="faction r">OBSIDIAN LEGION<div class="track"><div id="ebar" class="fill" style="width:100%"></div></div></div></div><main id="stage" class="stage"><div class="chapter"><b>CHAPTER I — THE ASHEN PLAINS</b><br>Wave <span id="wave">1</span>/8 · <span class="mana">MANA <span id="mana">240</span>/500</span></div><div class="speed"><button data-s="1" class="active">×1</button><button data-s="2">×2</button><button data-s="3">×3</button></div><div id="notice" class="notice"></div></main><div class="bottom"><div class="hero"><div class="portrait"></div><div><b>ARTHOS</b><br><small>ASHEN BLADE</small><div class="mini"><div class="row"><span>HP</span><span id="heroHp">3000</span></div><div class="tiny"><i id="heroHpBar" style="width:100%"></i></div><div class="row"><span>MANA</span><span id="heroMana">240</span></div><div class="tiny m"><i id="heroManaBar" style="width:48%"></i></div></div></div></div><div id="cards" class="cards"></div><div class="cmd"><button id="hold">HOLD</button><button id="assault" class="assault">ASSAULT</button><button id="retreat">RETREAT</button><button id="meteor" class="meteor">☄ METEOR RAIN</button></div></div></div><script>
const S=document.querySelector('#stage'),C=document.querySelector('#cards'),M=document.querySelector('#mana'),E=document.querySelector('#ebar'),P=document.querySelector('#pbar'),W=document.querySelector('#wave'),N=document.querySelector('#notice');
let mana=240,eh=8500,ph=8500,wave=1,speed=1,order='hold',last=performance.now(),enemySpawn=0,units=[],uid=0;
const DATA={sword:{name:'Swordsman',cost:50,hp:520,atk:62,range:52,spd:45,cool:.75},spear:{name:'Spearman',cost:70,hp:620,atk:78,range:58,spd:38,cool:.9},arch:{name:'Archer',cost:100,hp:390,atk:70,range:240,spd:34,cool:1.1},knight:{name:'Cavalry',cost:180,hp:980,atk:115,range:58,spd:72,cool:.9},berserk:{name:'Berserker',cost:120,hp:760,atk:128,range:55,spd:48,cool:.7},ballista:{name:'Ballista',cost:160,hp:700,atk:180,range:310,spd:18,cool:1.8},grunt:{name:'Legionary',cost:0,hp:560,atk:64,range:52,spd:40,cool:.85},raider:{name:'Raider',cost:0,hp:720,atk:92,range:54,spd:52,cool:.72},boss:{name:'Ash Tyrant',cost:0,hp:3500,atk:220,range:70,spd:25,cool:1.25}};
function icon(type,enemy=false){let red=enemy?'#7f1f27':'#244d79',edge=enemy?'#d85a60':'#b9d0e0',metal=enemy?'#52242a':'#788a96',dark=enemy?'#1b090c':'#111820';if(type==='ballista')return `<svg viewBox="0 0 100 100"><g stroke="#2a170d" stroke-width="5" stroke-linecap="round"><path d="M18 70h64M30 70l-10 18M70 70l10 18"/><circle cx="32" cy="76" r="10" fill="#5a3a1c"/><circle cx="68" cy="76" r="10" fill="#5a3a1c"/><path d="M20 55L80 34M22 32l58 22"/></g><path d="M18 45h64l-7 12H25z" fill="#6b4723"/></svg>`;let weapon=type==='arch'?'<path d="M72 20q18 30 0 60" fill="none" stroke="#9b6d3f" stroke-width="4"/><path d="M72 20v60" stroke="#ddd" stroke-width="1.5"/>':type==='spear'?'<path d="M77 8L55 88" stroke="#7b542b" stroke-width="5"/><path d="M74 8l8 12-12 2z" fill="#ddd"/>':'<path d="M77 28L58 88" stroke="#ddd" stroke-width="6"/><path d="M80 24l-11 7 8 5z" fill="#eee"/>';
return `<svg viewBox="0 0 100 120"><ellipse cx="50" cy="108" rx="27" ry="7" fill="#0008"/><path d="M35 48l-15 48h59L66 48z" fill="${red}" opacity=".9"/><path d="M31 45l13-15h15l13 15 9 47H22z" fill="url(#m${enemy?'r':'b'})" stroke="${edge}" stroke-width="1.5"/><defs><linearGradient id="m${enemy?'r':'b'}" x1="0" x2="1"><stop stop-color="${edge}"/><stop offset=".35" stop-color="${metal}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs><circle cx="51" cy="25" r="14" fill="${metal}" stroke="${edge}" stroke-width="2"/><path d="M38 23h26l-4 10H42z" fill="${dark}"/><path d="M27 52l-13 30" stroke="${metal}" stroke-width="8"/><path d="M70 52l12 30" stroke="${metal}" stroke-width="8"/>${weapon}${type==='knight'?'<path d="M18 92q30 20 65 0l10 18H9z" fill="#6b4c31"/><circle cx="28" cy="90" r="10" fill="#1b1714"/>':''}</svg>`}
const deck=['sword','spear','arch','knight','berserk','ballista'];deck.forEach(k=>{let d=DATA[k],b=document.createElement('button');b.className='card';b.innerHTML=`<div class="art">${icon(k)}</div><div class="name">${d.name}</div><div class="cost">💧 ${d.cost} MANA</div>`;b.onclick=()=>spawnFriendly(k);C.append(b)});
function say(t){N.textContent=t;N.classList.add('on');setTimeout(()=>N.classList.remove('on'),850)}
function makeUnit(type,enemy,x,bottom){let d=DATA[type],el=document.createElement('div');el.className='unit '+(enemy?'enemy ':'')+'walk';el.style.left=x+'%';el.style.bottom=bottom+'%';el.innerHTML=`<div class="hp"><i style="width:100%"></i></div>${icon(type,enemy)}`;S.append(el);let u={id:++uid,type,enemy,el,x,bottom,hp:d.hp,max:d.hp,atk:d.atk,range:d.range,spd:d.spd,cool:d.cool,t:Math.random()*.5};units.push(u);return u}
function spawnFriendly(type){let d=DATA[type];if(mana<d.cost)return say('Not enough mana');mana-=d.cost;makeUnit(type,false,14+Math.random()*2,14+Math.random()*8);say(d.name+' deployed')}
function spawnEnemy(){let boss=wave===8&&units.filter(u=>u.enemy&&u.type==='boss').length===0;let t=boss?'boss':(Math.random()<.25?'raider':'grunt');makeUnit(t,true,84+Math.random()*2,14+Math.random()*8);if(boss)say('ASH TYRANT ENTERS THE FIELD')}
function shoot(a,b){let ar=document.createElement('i');ar.className='arrow';ar.style.left=(a.x+2)+'%';ar.style.bottom=(a.bottom+8)+'%';let dx=(b.x-a.x),dy=(b.bottom-a.bottom);ar.style.transform=`rotate(${Math.atan2(-dy,dx)*180/Math.PI}deg)`;S.append(ar);requestAnimationFrame(()=>{ar.style.transition=`left ${.22/speed}s linear,bottom ${.22/speed}s linear`;ar.style.left=b.x+'%';ar.style.bottom=(b.bottom+8)+'%'});setTimeout(()=>ar.remove(),260/speed)}
function hit(a,b){a.t=a.cool;a.el.classList.add('attack');setTimeout(()=>a.el.classList.remove('attack'),230/speed);if(a.range>100)shoot(a,b);b.hp-=a.atk*(.9+Math.random()*.2);b.el.classList.add('hit');setTimeout(()=>b.el.classList.remove('hit'),100);b.el.querySelector('.hp i').style.width=Math.max(0,b.hp/b.max*100)+'%';if(b.hp<=0){b.el.classList.add('dead');setTimeout(()=>b.el.remove(),450);units=units.filter(x=>x!==b)}}
function nearest(u){let foes=units.filter(v=>v.enemy!==u.enemy&&v.hp>0);if(!foes.length)return null;foes.sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x));return foes[0]}
for(let i=0;i<6;i++)makeUnit(i%3===0?'spear':i%3===1?'sword':'arch',false,19+i*2.7,15+(i%2)*6);for(let i=0;i<7;i++)makeUnit(i%2?'grunt':'raider',true,78-i*2.3,15+(i%2)*6);
document.querySelector('#meteor').onclick=()=>{if(mana<300)return say('Need 300 mana');mana-=300;for(let i=0;i<7;i++)setTimeout(()=>{let x=document.createElement('i');x.className='impact';x.style.left=(54+Math.random()*34)+'%';x.style.top=(18+Math.random()*52)+'%';S.append(x);setTimeout(()=>x.remove(),700)},i*80);units.filter(u=>u.enemy).forEach(u=>{u.hp-=420;u.el.querySelector('.hp i').style.width=Math.max(0,u.hp/u.max*100)+'%';if(u.hp<=0){u.el.classList.add('dead');setTimeout(()=>u.el.remove(),450)}});units=units.filter(u=>u.hp>0);eh=Math.max(0,eh-1100);say('METEOR RAIN!')};
document.querySelector('#hold').onclick=()=>{order='hold';say('Hold the line!')};document.querySelector('#assault').onclick=()=>{order='assault';say('ALL UNITS — ASSAULT!')};document.querySelector('#retreat').onclick=()=>{order='retreat';say('Fall back!')};document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('active'));b.classList.add('active');say('Battle speed ×'+speed)});
function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;mana=Math.min(500,mana+12*dt*speed);enemySpawn+=dt*speed;if(enemySpawn>2.7&&units.filter(u=>u.enemy).length<12){enemySpawn=0;spawnEnemy()}for(let u of [...units]){u.t-=dt*speed;let n=nearest(u);if(!n)continue;let dist=Math.abs(n.x-u.x)*14;if(dist<=u.range){u.el.classList.remove('walk');if(u.t<=0)hit(u,n)}else{u.el.classList.add('walk');let dir=u.enemy?-1:1;if(!u.enemy&&order==='retreat')dir=-1;if(!u.enemy&&order==='hold'&&u.x>44)dir=0;u.x+=dir*u.spd*dt*speed*.018;u.x=Math.max(6,Math.min(92,u.x));u.el.style.left=u.x+'%'}}let blue=units.filter(u=>!u.enemy).length,red=units.filter(u=>u.enemy).length;if(order==='assault'&&blue>red)eh=Math.max(0,eh-14*dt*speed*(blue-red+1));if(red>blue+2)ph=Math.max(0,ph-10*dt*speed*(red-blue));if(order==='retreat')ph=Math.min(8500,ph+8*dt*speed);M.textContent=Math.floor(mana);document.querySelector('#heroMana').textContent=Math.floor(mana);document.querySelector('#heroManaBar').style.width=(mana/5)+'%';E.style.width=(eh/85)+'%';P.style.width=(ph/85)+'%';let nw=Math.min(8,1+Math.floor((8500-eh)/1062));if(nw!==wave){wave=nw;W.textContent=wave;say(wave===8?'BOSS WAVE':'Wave '+wave)}if(eh<=0){eh=8500;wave=1;W.textContent=1;units.filter(u=>u.enemy).forEach(u=>u.el.remove());units=units.filter(u=>!u.enemy);say('VICTORY — Obsidian line shattered!')}if(ph<=0){ph=8500;say('RAVENHOLD BREACHED — regroup!')}requestAnimationFrame(loop)}requestAnimationFrame(loop)
</script></body></html>
