und:linear-gradient(#372919,#120d08);border:2px ridge #9a7442;font-weight:800;text-shadow:0 2px #000}.speed button{width:54px;height:44px}.speed button.active{background:linear-gradient(#755326,#2b190c);box-shadow:0 0 12px #c58a43}.notice{position:absolute;z-index:28;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 18px;background:#060709ef;border:1px solid #b58a52;opacity:0;transition:.2s;box-shadow:0 5px 15px #000}.notice.on{opacity:1}.unit{position:absolute;z-index:8;width:62px;height:90px;bottom:15%;filter:drop-shadow(0 7px 5px #000b);transform-origin:50% 100%;will-change:transform,left}.unit.friendly{--cloth:#255f9e;--cloth2:#0d2740;--metal:#b8c0c5;--dark:#20272d;--glow:#74c7ff}.unit.enemy{--cloth:#842630;--cloth2:#2b090d;--metal:#80535a;--dark:#1c0a0d;--glow:#ff5d60}.unit.hero{width:86px;height:124px;z-index:11}.unit.brute{width:102px;height:145px;z-index:10}.unit.moving{animation:stride .42s ease-in-out infinite alternate}.unit.attack svg{animation:slash .28s ease-out}.unit.hit{animation:hit .2s ease-out}.unit.dead{animation:die .5s forwards}.unit svg{width:100%;height:100%;overflow:visible}.shadow{fill:#0009}.cape{fill:var(--cloth2)}.cloth{fill:var(--cloth)}.metal{fill:var(--metal)}.dark{fill:var(--dark)}.glow{fill:var(--glow);filter:drop-shadow(0 0 4px var(--glow))}.weapon{stroke:#d9dde0;stroke-width:5;stroke-linecap:round}.wood{stroke:#845b32;stroke-width:5;stroke-linecap:round}.hpmini{position:absolute;left:8%;right:8%;top:-7px;height:5px;background:#120607;border:1px solid #000;box-shadow:0 1px 4px #000}.hpmini i{display:block;height:100%;width:100%;background:#1e8ce5}.enemy .hpmini i{background:#d72e36}.projectile{position:absolute;z-index:16;width:18px;height:4px;background:#d7c394;border-radius:4px;box-shadow:0 0 5px #fff6;transform-origin:center}.arrow:after{content:"";position:absolute;right:-7px;top:-3px;border-left:8px solid #c4c4c4;border-top:5px solid transparent;border-bottom:5px solid transparent}.impact{position:absolute;z-index:18  .assault{background:linear-gradient(#8e272d,#300b0e);border-color:#c85a5e}.cmd .meteor{grid-column:1/3;background:linear-gradient(#6a2a15,#1b0a05);color:#ffd7b5}.cmd button.active{box-shadow:inset 0 0 20px #d8a35066,0 0 12px #9c6f31}.statline{position:absolute;left:7px;right:7px;bottom:6px;height:5px;background:#1a0b0b;border:1px solid #56452e}.statline i{display:block;height:100%;background:linear-gradient(90deg,#a61923,#ff484e)}@keyframes stride{to{transform:translateY(-4px) rotate(.8deg)}}@keyframes slash{40%{transform:rotate(-8deg) translateX(4px)}70%{transform:rotate(5deg) translateX(-3px)}}@keyframes hit{50%{transform:translateX(-7px) rotate(-3deg);filter:brightness(1.8)}}@keyframes die{to{transform:rotate(78deg) translate(18px,30px);opacity:0}}@keyframes boom{from{transform:translate(170px,-290px) scale(.25)}to{transform:translate(0,0) scale(2.4);opacity:0}}@keyframes dust{to{transform:scale(2);opacity:0}}@media(max-width:800px){.game{grid-template-rows:50px 1fr 136px}.top{grid-template-columns:1fr 190px 1fr;padding:4px 7px;gap:6px}.brand{font-size:14px;letter-spacing:2px}.brand span{font-size:8px;letter-spacing:3px}.faction{font-size:9px}.track{height:10px}.chapter{top:6px;min-width:255px;font-size:10px;padding:5px 10px}.speed{left:5px;top:48px}.speed button{width:38px;height:31px;font-size:9px}.bottom{grid-template-columns:94px 1fr 152px;padding:5px}.heroArt{height:68px}.heroArt svg{width:70px;height:76px}.hero b{font-size:11px}.hero small{font-size:8px}.card{min-width:78px;padding:3px}.art{height:62px}.art svg{height:64px;width:56px}.card.ballista .art svg{width:75px}.name{font-size:8px}.cost{font-size:7px}.cmd{gap:3px}.cmd button{font-size:8px}.unit{width:44px;height:66px}.unit.hero{width:58px;height:88px}.unit.brute{width:72px;height:104px}}@media(orientation:portrait){body:before{content:'Rotate phone for battle';position:fixed;inset:0;z-index:999;background:#050607;display:grid;place-items:center;font:bold 24px Georgia;color:#d6b578;text-align:center;padding:30px}}</style></head><body><div class="game"><div class="top"><div class="faction l">RAVENHOLD<div class="track"><div id="pbar" class="fill" style="width:100%"></div></div></div><div class="brand">WARFRONT<span>RISE OF ASH</span></div><div class="faction r">OBSIDIAN LEGION<div class="track"><div id="ebar" class="fill" style="width:100%"></div></div></div></div><main id="stage" class="stage"><div class="chapter"><b>CHAPTER I — THE ASHEN PLAINS</b><br>Wave <span id="wave">1</span>/8 · <span class="mana">MANA <span id="mana">240</span>/500</span></div><div class="speed"><button data-s="1" class="active">×1</button><button data-s="2">×2</button><button data-s="3">×3</button></div><div id="notice" class="notice"></div></main><div class="bottom"><div class="hero"><div id="heroArt" class="heroArt"></div><b>ARTHOS</b><br><small>ASHEN BLADE</small><div class="statline"><i id="heroHp" style="width:100%"></i></div></div><div id="cards" class="cards"></div><div class="cmd"><button id="hold" class="active">HOLD</button><button id="assault" class="assault">ASSAULT</button><button id="retreat">RETREAT</button><button id="meteor" class="meteor">☄ METEOR RAIN<br><small>300 MANA</small></button></div></div></div><script>const S=document.querySelector('#stage'),C=document.querySelector('#cards'),M=document.querySelector('#mana'),E=document.querySelector('#ebar'),P=document.querySelector('#pbar'),W=document.querySelector('#wave'),N=document.querySelector('#notice');let mana=240,eh=8500,ph=8500,wave=1,speed=1,order='hold',last=performance.now(),enemyTimer=0,units=[];const DATA=[['Swordsman',50,'sword'],['Spearman',70,'spear'],['Archer',100,'archer'],['Cavalry',180,'cavalry'],['Berserker',120,'berserker'],['Ballista',160,'ballista']];function sprite(type,enemy=false){let c=enemy?'enemy':'friendly';if(type==='ballista')return `<svg viewBox="0 0 120 90"><ellipse class="shadow" cx="61" cy="80" rx="48" ry="7"/><circle class="dark" cx="35" cy="67" r="14"/><circle class="dark" cx="87" cy="67" r="14"/><rect class="wood" x="27" y="49" width="67" height="12" rx="4"/><path class="wood" d="M52 50L72 18M67 50L45 18"/><path class="weapon" d="M40 27h48"/><path class="wood" d="M38 27Q60 5 90 27" fill="none"/><path d="M58 23h55" stroke="#ddd" stroke-width="3"/><path d="M108 18l10 5-10 5z" fill="#ddd"/></svg>`;if(type==='cavalry')return `<svg viewBox="0 0 90 120"><ellipse class="shadow" cx="45" cy="110" rx="35" ry="7"/><path class="dark" d="M13 88Q16 57 43 60Q73 60 80 84L70 101H55L48 90 34 102H18z"/><circle class="dark" cx="72" cy="69" r="13"/><path class="cloth" d="M27 59l17-18 18 15-7 27-29 1z"/><circle class="metal" cx="46" cy="34" r="10"/><path class="cape" d="M37 43L17 73l27-9z"/><path class="weapon" d="M58 43l24-29"/></svg>`;let shield=type==='sword'||type==='spear';let bow=type==='archer';let bers=type==='berserker';return `<svg viewBox="0 0 80 120"><ellipse class="shadow" cx="40" cy="113" rx="29" ry="6"/><path class="cape" d="M25 52L14 101l26-13 23 13-8-52z"/><path class="dark" d="M28 88l-5 24h12l5-26 5 26h12l-4-25z"/><path class="cloth" d="M24 49Q40 38 56 49l7 40H17z"/><path class="metal" d="M18 51l11-12 7 8-10 18zM62 51L51 39l-7 8 10 18z"/><circle class="metal" cx="40" cy="28" r="15"/><path class="dark" d="M27 27h26v8H27z"/><rect class="glow" x="31" y="29" width="18" height="3" rx="2"/>${shield?`<path class="metal" d="M13 56q13-11 25 0v31q-12 16-25 0z"/><path class="cloth" d="M18 60h15v20H18z"/>`:''}${bow?`<path class="wood" d="M61 46Q79 62 62 89" fill="none"/><path d="M62 46L62 89" stroke="#ddd" stroke-width="1.5"/>`:''}${type==='spear'?`<path class="wood" d="M59 95L70 17"/><path d="M70 17l7 13-11-1z" fill="#ddd"/>`:''}${type==='sword'?`<path class="weapon" d="M57 86L71 39"/><path d="M66 39h13" stroke="#967345" stroke-width="4"/>`:''}${bers?`<path class="wood" d="M58 83L72 42"/><path class="metal" d="M67 39q18-5 9 17l-12-5z"/><path class="dark" d="M26 18q14-18 28 0l-6 6-18 0z"/>`:''}</svg>`}function card(u){let b=document.createElement('button');b.className='card '+u[2];b.innerHTML='<div class="art">'+sprite(u[2])+'</div><div class="name">'+u[0]+'</div><div class="cost">💧 '+u[1]+' MANA</div><div class="cd"><i></i></div>';b.onclick=()=>deploy(u,b);C.append(b)}DATA.forEach(card);document.querySelector('#heroArt').innerHTML=`<svg viewBox="0 0 90 120"><ellipse class="shadow" cx="45" cy="112" rx="35" ry="7"/><path fill="#641720" d="M24 48L8 106l38-18 33 17-18-61z"/><path fill="#171b20" d="M29 50Q45 35 62 50l8 45H20z"/><path fill="#aeb6bb" d="M18 52l13-16 8 10-12 20zM72 52L58 36l-8 10 13 20z"/><circle fill="#c6c8c7" cx="45" cy="27" r="17"/><path fill="#141619" d="M29 25h32v11H29z"/><rect fill="#6bc5ff" x="35" y="29" width="20" height="3" rx="2"/><path d="M63 87L80 30" stroke="#e5e7e7" stroke-width="6" stroke-linecap="round"/><path d="M73 31h15" stroke="#8e6d43" stroke-width="4"/></svg>`;function say(t){N.textContent=t;N.classList.add('on');clearTimeout(N._t);N._t=setTimeout(()=>N.classList.remove('on'),900)}function spawn(type,enemy=false,x=null,y=null){let d=document.createElement('div');d.className='unit '+(enemy?'enemy':'friendly')+' moving '+(type==='hero'?'hero ':'')+(type==='brute'?'brute ':'');d.style.left=(x??(enemy?82:12))+'%';d.style.bottom=(y??(14+Math.random()*10))+'%';d.innerHTML=sprite(type==='hero'?'sword':type,enemy)+'<span class="hpmini"><i></i></span>';S.append(d);let o={el:d,type,enemy,hp:type==='brute'?900:type==='hero'?1500:300,atk:type==='brute'?140:type==='ballista'?180:type==='archer'?90:75,range:type==='archer'||type==='ballista',dead:false};units.push(o);return o}function deploy(u,b){if(mana<u[1])return say('Not enough mana');mana-=u[1];let o=spawn(u[2],false,13,13+Math.random()*9);b.classList.add('cool');setTimeout(()=>b.classList.remove('cool'),800);say(u[0]+' deployed');if(u[2]==='ballista'){o.el.style.width='90px'}}function damage(o,amt){if(o.dead)return;o.hp-=amt;o.el.classList.add('hit');setTimeout(()=>o.el.classList.remove('hit'),180);let max=o.type==='brute'?900:o.type==='hero'?1500:300;o.el.querySelector('.hpmini i').style.width=Math.max(0,o.hp/max*100)+'%';if(o.hp<=0){o.dead=true;o.el.classList.add('dead');setTimeout(()=>o.el.remove(),520)}}function nearest(o){let pool=units.filter(x=>!x.dead&&x.enemy!==o.enemy);if(!pool.length)return null;return pool.sort((a,b)=>Math.abs(parseFloat(a.el.style.left)-parseFloat(o.el.style.left))-Math.abs(parseFloat(b.el.style.left)-parseFloat(o.el.style.left)))[0]}function shoot(o,t){let a=document.createElement('i');a.className='projectile arrow';let x=parseFloat(o.el.style.left),tx=parseFloat(t.el.style.left);a.style.left=x+'%';a.style.bottom=(parseFloat(o.el.style.bottom)+8)+'%';a.style.transition=`left ${.5/speed}s linear`;S.append(a);requestAnimationFrame(()=>a.style.left=tx+'%');setTimeout(()=>{damage(t,o.atk);a.remove()},500/speed)}function fight(dt){for(let o of units){if(o.dead)continue;let x=parseFloat(o.el.style.left),target=nearest(o);if(!target){if(!o.enemy&&order==='assault')eh=Math.max(0,eh-o.atk*.05*dt);continue}let tx=parseFloat(target.el.style.left),dist=Math.abs(tx-x),range=o.range?12:4.2;if(dist>range){let dir=o.enemy?-1:1;if(!o.enemy&&order==='hold'&&x>44)dir=0;if(!o.enemy&&order==='retreat')dir=-1;o.el.style.left=Math.max(7,Math.min(91,x+dir*(7+(o.type==='cavalry'?6:0))*dt*speed))+'%';if(Math.random()<.04){let dust=document.createElement('i');dust.className='dust';dust.style.left=x+'%';dust.style.bottom=o.el.style.bottom;S.append(dust);setTimeout(()=>dust.remove(),600)}}else{if(!o._cd||performance.now()>o._cd){o._cd=performance.now()+(o.range?900:700)/speed;o.el.classList.remove('moving');o.el.classList.add('attack');setTimeout(()=>o.el.classList.remove('attack'),300);if(o.range)shoot(o,target);else damage(target,o.atk)}}}}function enemyWave(){let count=wave<3?2:wave<6?3:4;for(let i=0;i<count;i++)setTimeout(()=>spawn(i%3===0?'spear':i%3===1?'sword':'archer',true,87+Math.random()*3,13+Math.random()*10),i*260);if(wave===8&&!units.some(x=>x.enemy&&x.type==='brute'&&!x.dead)){spawn('brute',true,89,20);say('ASH TYRANT ENTERS THE FIELD')}}spawn('hero',false,9,20);for(let i=0;i<5;i++)spawn(i%3===0?'sword':i%3===1?'spear':'archer',false,18+i*2.7,13+(i%2)*5);for(let i=0;i<6;i++)spawn(i%3===0?'spear':i%3===1?'sword':'archer',true,82-i*2.3,13+(i%2)*5);document.querySelector('#meteor').onclick=()=>{if(mana<300)return say('Need 300 mana');mana-=300;for(let i=0;i<7;i++)setTimeout(()=>{let x=document.createElement('i');x.className='impact';x.style.left=(56+Math.random()*30)+'%';x.style.top=(20+Math.random()*48)+'%';S.append(x);setTimeout(()=>x.remove(),700)},i*85);for(let o of units.filter(x=>x.enemy&&!x.dead))damage(o,420);eh=Math.max(0,eh-650);say('METEOR RAIN!')};['hold','assault','retreat'].forEach(id=>document.querySelector('#'+id).onclick=()=>{order=id;document.querySelectorAll('.cmd button').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');say(id==='assault'?'ALL UNITS — ASSAULT!':id==='retreat'?'Fall back!':'Hold the line!')});document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('active'));b.classList.add('active');say('Battle speed ×'+speed)});function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;mana=Math.min(500,mana+13*dt*speed);enemyTimer+=dt*speed;if(enemyTimer>6.5){enemyTimer=0;enemyWave()}fight(dt);let liveF=units.filter(x=>!x.enemy&&!x.dead).length,liveE=units.filter(x=>x.enemy&&!x.dead).length;if(liveE>liveF+3)ph=Math.max(0,ph-8*dt*speed*(liveE-liveF));if(liveF>liveE+2&&order==='assault')eh=Math.max(0,eh-10*dt*speed*(liveF-liveE));M.textContent=Math.floor(mana);E.style.width=(eh/85)+'%';P.style.width=(ph/85)+'%';let nw=Math.min(8,1+Math.floor((8500-eh)/1062));if(nw!==wave){wave=nw;W.textContent=wave;say(wave===8?'FINAL WAVE — ASH TYRANT':'Wave '+wave);enemyWave()}if(eh<=0){say('VICTORY — Obsidian line shattered!');eh=8500;wave=1;W.textContent=1}if(ph<=0){say('RAVENHOLD HAS FALLEN');ph=8500}units=units.filter(x=>!x.dead||x.el.isConnected);requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
