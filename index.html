<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Warfront: Rise of Ash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#eee;font-family:Georgia,serif}.game{height:100%;display:grid;grid-template-rows:72px 1fr 168px;background:#08090b}.top{display:grid;grid-template-columns:1fr 430px 1fr;align-items:center;gap:16px;padding:7px 18px;background:linear-gradient(#17191d,#050608);border-bottom:3px ridge #8d6a3d;z-index:20}.faction{font-size:15px;font-weight:800;letter-spacing:1px}.faction.r{text-align:right;color:#e58983}.faction.l{color:#b7d8ff}.track{height:15px;margin-top:4px;background:#08090a;border:2px ridge #84643b;padding:2px}.fill{height:100%;transition:width .2s;background:linear-gradient(90deg,#145aa1,#39a8ff)}.r .fill{margin-left:auto;background:linear-gradient(90deg,#9d151c,#ff3939)}.brand{text-align:center;font-weight:900;font-size:28px;letter-spacing:5px;text-shadow:0 3px #000}.brand span{display:block;color:#c8423d;font-size:13px;letter-spacing:7px}.stage{position:relative;overflow:hidden;background:url('assets/battlefield.svg') center/cover no-repeat;isolation:isolate}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(#0002 0,#0000 55%,#0009 100%);pointer-events:none}.chapter{position:absolute;z-index:10;left:50%;top:12px;transform:translateX(-50%);min-width:340px;text-align:center;padding:8px 20px;background:#07090bea;border:3px ridge #85633a;box-shadow:0 4px 16px #000}.chapter b{letter-spacing:1px}.mana{color:#55b8ff}.speed{position:absolute;z-index:12;left:12px;top:15px;display:grid;gap:3px}.speed button,.cmd button{color:#eee;background:linear-gradient(#322719,#100c08);border:2px ridge #8c6839;font-weight:800}.speed button{width:52px;height:43px}.notice{position:absolute;z-index:15;left:50%;bottom:20px;transform:translateX(-50%);padding:7px 18px;background:#060709e8;border:1px solid #a17b48;opacity:0;transition:.2s}.notice.on{opacity:1}.impact{position:absolute;z-index:9;width:70px;height:70px;border-radius:50%;background:#ffb127;box-shadow:0 0 30px #ff3c00,0 0 80px #ff6a00;animation:boom .65s forwards}@keyframes boom{from{transform:translate(180px,-280px) scale(.3)}to{transform:translate(0,0) scale(2.3);opacity:0}}.bottom{display:grid;grid-template-columns:190px 1fr 270px;gap:9px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#111317,#030405);border-top:3px ridge #8d6a3d}.hero{position:relative;border:3px ridge #80613a;background:radial-gradient(circle at 50% 25%,#48515a,#121416 58%,#060708);padding:7px;text-align:center;overflow:hidden}.heroArt{height:92px;position:relative}.heroArt:before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;width:72px;height:88px;background:linear-gradient(115deg,#9da4a7,#30363b 35%,#0b0c0d 70%);clip-path:polygon(38% 0,62% 0,74% 16%,86% 42%,76% 100%,24% 100%,12% 42%,26% 16%)}.heroArt:after{content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);width:40px;height:40px;border-radius:46% 46% 42% 42%;background:linear-gradient(135deg,#2d211d,#0a0909);box-shadow:-26px 38px 0 7px #6f1b25}.hero b{font-size:17px}.hero small{color:#d5c09a}.cards{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.card{position:relative;min-width:115px;padding:5px;color:#eee;background:linear-gradient(#20252a,#090b0d);border:3px ridge #765a37;text-align:center;touch-action:manipulation}.card:active{transform:scale(.96)}.art{height:88px;position:relative;background:radial-gradient(circle at 50% 45%,#47515a,#15181b 60%,#090a0b);overflow:hidden}.art:before{content:"";position:absolute;left:38px;top:16px;width:34px;height:62px;background:linear-gradient(110deg,#9da6aa,#34485a 45%,#10161c);clip-path:polygon(35% 0,65% 0,78% 20%,100% 100%,0 100%,22% 20%)}.art:after{content:"";position:absolute;left:48px;top:7px;width:20px;height:22px;border-radius:45%;background:#76818a;border:2px solid #bec4c5}.card.arch .art:before{background:linear-gradient(110deg,#6f6656,#233c55)}.card.spear .art{background:linear-gradient(135deg,#17202a,#39434b)}.card.knight .art:before{width:42px;left:34px;background:linear-gradient(110deg,#c1c4c2,#46505a,#111)}.card.berserk .art:before{background:linear-gradient(110deg,#7c3329,#25100d)}.card.ballista .art:before{left:18px;top:42px;width:80px;height:25px;background:#674421;clip-path:none}.name{font:bold 11px Arial;margin-top:5px}.cost{font:10px Arial;color:#65c2ff;margin-top:3px}.cmd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmd button{font-size:12px}.cmd .assault{background:linear-gradient(#8b252a,#310c0f);border-color:#c25255}.cmd .meteor{grid-column:1/3;background:linear-gradient(#5a2514,#190a05);color:#ffd4b1}.deploy{position:absolute;z-index:8;width:36px;height:54px;bottom:18%;filter:drop-shadow(0 5px 3px #000);transition:left 2.5s linear}.deploy.blue{background:linear-gradient(110deg,#b9c2c6,#31567b 50%,#0c1620);clip-path:polygon(35% 0,65% 0,76% 18%,100% 100%,0 100%,24% 18%)}.deploy.red{background:linear-gradient(110deg,#a65a5d,#70232b 50%,#1c080b);clip-path:polygon(35% 0,65% 0,76% 18%,100% 100%,0 100%,24% 18%)}@media(max-width:800px){.game{grid-template-rows:50px 1fr 132px}.top{grid-template-columns:1fr 190px 1fr;padding:4px 7px;gap:6px}.brand{font-size:14px;letter-spacing:2px}.brand span{font-size:8px;letter-spacing:3px}.faction{font-size:9px}.track{height:10px}.chapter{top:6px;min-width:255px;font-size:10px;padding:5px 10px}.speed{top:50px}.speed button{width:38px;height:31px;font-size:9px}.bottom{grid-template-columns:95px 1fr 150px;padding:5px}.heroArt{height:65px}.heroArt:before{height:65px;width:52px}.heroArt:after{width:29px;height:29px;box-shadow:-18px 28px 0 5px #6f1b25}.hero b{font-size:11px}.hero small{font-size:8px}.card{min-width:76px;padding:3px}.art{height:61px}.art:before{left:25px;top:11px;width:25px;height:44px}.art:after{left:32px;top:5px;width:16px;height:17px}.card.knight .art:before{left:22px;width:30px}.card.ballista .art:before{left:12px;top:30px;width:54px;height:18px}.name{font-size:8px}.cost{font-size:7px}.cmd{gap:3px}.cmd button{font-size:8px}}</style></head><body><div class="game"><div class="top"><div class="faction l">RAVENHOLD<div class="track"><div id="pbar" class="fill" style="width:100%"></div></div></div><div class="brand">WARFRONT<span>RISE OF ASH</span></div><div class="faction r">OBSIDIAN LEGION<div class="track"><div id="ebar" class="fill" style="width:100%"></div></div></div></div><main id="stage" class="stage"><div class="chapter"><b>CHAPTER I — THE ASHEN PLAINS</b><br>Wave <span id="wave">1</span>/8 · <span class="mana">MANA <span id="mana">240</span>/500</span></div><div class="speed"><button data-s="1">×1</button><button data-s="2">×2</button><button data-s="3">×3</button></div><div id="notice" class="notice"></div></main><div class="bottom"><div class="hero"><div class="heroArt"></div><b>ARTHOS</b><br><small>ASHEN BLADE</small></div><div id="cards" class="cards"></div><div class="cmd"><button id="hold">HOLD</button><button id="assault" class="assault">ASSAULT</button><button id="retreat">RETREAT</button><button id="meteor" class="meteor">☄ METEOR RAIN</button></div></div></div><script>const S=document.querySelector('#stage'),C=document.querySelector('#cards'),M=document.querySelector('#mana'),E=document.querySelector('#ebar'),P=document.querySelector('#pbar'),W=document.querySelector('#wave'),N=document.querySelector('#notice');let mana=240,eh=8500,ph=8500,wave=1,speed=1,order='hold',last=performance.now();const U=[['Swordsman',50,'sword'],['Spearman',70,'spear'],['Archer',100,'arch'],['Cavalry',180,'knight'],['Berserker',120,'berserk'],['Ballista',160,'ballista']];U.forEach(u=>{let b=document.createElement('button');b.className='card '+u[2];b.innerHTML='<div class="art"></div><div class="name">'+u[0]+'</div><div class="cost">💧 '+u[1]+' MANA</div>';b.onclick=()=>deploy(u);C.append(b)});function say(t){N.textContent=t;N.classList.add('on');setTimeout(()=>N.classList.remove('on'),850)}function deploy(u){if(mana<u[1])return say('Not enough mana');mana-=u[1];let d=document.createElement('i');d.className='deploy blue';d.style.left='17%';d.style.bottom=(15+Math.random()*11)+'%';S.append(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.left='58%'));setTimeout(()=>{eh=Math.max(0,eh-(110+u[1]*1.8));d.remove()},2500/speed);say(u[0]+' deployed')}document.querySelector('#meteor').onclick=()=>{if(mana<300)return say('Need 300 mana');mana-=300;for(let i=0;i<6;i++)setTimeout(()=>{let x=document.createElement('i');x.className='impact';x.style.left=(58+Math.random()*26)+'%';x.style.top=(22+Math.random()*45)+'%';S.append(x);setTimeout(()=>x.remove(),700)},i*90);eh=Math.max(0,eh-1100);say('METEOR RAIN!')};document.querySelector('#hold').onclick=()=>{order='hold';say('Hold the line!')};document.querySelector('#assault').onclick=()=>{order='assault';say('ALL UNITS — ASSAULT!')};document.querySelector('#retreat').onclick=()=>{order='retreat';say('Fall back!')};document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;say('Battle speed ×'+speed)});function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;mana=Math.min(500,mana+13*dt*speed);if(order==='assault')eh=Math.max(0,eh-24*dt*speed);if(order==='retreat')ph=Math.min(8500,ph+12*dt*speed);M.textContent=Math.floor(mana);E.style.width=(eh/85)+'%';P.style.width=(ph/85)+'%';let nw=Math.min(8,1+Math.floor((8500-eh)/1062));if(nw!==wave){wave=nw;W.textContent=wave;say(wave===8?'ASH TYRANT APPROACHES':'Wave '+wave)}if(eh<=0){eh=8500;wave=1;W.textContent=1;say('VICTORY — Obsidian line shattered!')}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
